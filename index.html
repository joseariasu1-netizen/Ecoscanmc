<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EcoScan & Ciudad Limpia</title>
    <meta name="description" content="Plataforma PWA e IA de Economía Circular para la I.E. Rafael Uribe Uribe y la Alcaldía de Medellín, con reconocimiento de residuos, sistema de EcoMonedas canjeables y campaña Mi Metro Cuadrado." />
    <meta property="og:title" content="EcoScan & Ciudad Limpia" />
    <meta property="og:description" content="Plataforma PWA e IA de Economía Circular para la I.E. Rafael Uribe Uribe y la Alcaldía de Medellín, con reconocimiento de residuos, sistema de EcoMonedas canjeables y campaña Mi Metro Cuadrado." />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('ServiceWorker registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
